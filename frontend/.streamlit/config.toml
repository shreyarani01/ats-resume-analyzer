[theme]
primaryColor = "#10B981"               # Emerald Green accent
backgroundColor = "#0F172A"            # Dark Navy / Slate background
secondaryBackgroundColor = "#1E293B"  # Darker Slate for sidebar & cards
textColor = "#F8FAFC"                  # Crisp white text
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"